name: Peer Room Foundation CI

on:
  push:
    branches: [main]
    paths:
      - 'src/js/33-direct-chat-v2.js'
      - 'src/js/34-peer-room-foundation.js'
      - 'src/js/35-peer-room-hardening.js'
      - 'src/styles/67-peer-room-foundation.css'
      - 'tests/test-direct-chat-v2.mjs'
      - 'tests/test-direct-chat-v2-generated.mjs'
      - 'tests/test-peer-room-hardening.mjs'
      - '.github/workflows/peer-room-ci.yml'
  pull_request:
    paths:
      - 'src/js/33-direct-chat-v2.js'
      - 'src/js/34-peer-room-foundation.js'
      - 'src/js/35-peer-room-hardening.js'
      - 'src/styles/67-peer-room-foundation.css'
      - 'tests/test-direct-chat-v2.mjs'
      - 'tests/test-direct-chat-v2-generated.mjs'
      - 'tests/test-peer-room-hardening.mjs'
      - '.github/workflows/peer-room-ci.yml'

jobs:
  peer-room-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/js/33-direct-chat-v2.js
          node --check src/js/34-peer-room-foundation.js
          node --check src/js/35-peer-room-hardening.js
          node --check tests/test-direct-chat-v2.mjs
          node --check tests/test-direct-chat-v2-generated.mjs
          node --check tests/test-peer-room-hardening.mjs
      - name: Peer Room source contract
        run: node tests/test-direct-chat-v2.mjs
      - name: Remove Player cleanup contract
        run: node tests/test-peer-room-hardening.mjs
      - name: Build Alpha shell
        run: python3 tools/build_duel_modes_alpha.py
      - name: Generated loader contract
        run: node tests/test-direct-chat-v2-generated.mjs
