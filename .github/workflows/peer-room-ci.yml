name: Peer Room Foundation CI

on:
  push:
    branches: [main]
    paths:
      - 'src/js/33-direct-chat-v2.js'
      - 'src/js/34-peer-room-foundation.js'
      - 'src/js/35-peer-room-hardening.js'
      - 'src/js/36-peer-room-match.js'
      - 'src/js/37-peer-room-runtime.js'
      - 'src/js/38-peer-room-polish.js'
      - 'src/js/39-peer-room-presentation.js'
      - 'src/js/40-peer-room-transaction.js'
      - 'src/js/41-peer-room-presentation-sync.js'
      - 'src/js/42-peer-room-recovery-nav.js'
      - 'src/styles/67-peer-room-foundation.css'
      - 'src/styles/68-peer-room-match.css'
      - 'src/styles/69-peer-room-polish.css'
      - 'src/styles/70-peer-room-presentation.css'
      - 'tests/test-direct-chat-v2.mjs'
      - 'tests/test-direct-chat-v2-generated.mjs'
      - 'tests/test-peer-room-hardening.mjs'
      - 'tests/test-peer-room-match.mjs'
      - 'tests/test-peer-room-match-soak.mjs'
      - 'tests/test-peer-room-runtime.mjs'
      - 'tests/test-peer-room-polish.mjs'
      - 'tests/test-peer-room-presentation.mjs'
      - 'tests/test-peer-room-transaction.mjs'
      - 'tests/test-peer-room-presentation-sync.mjs'
      - 'tests/test-peer-room-recovery-nav.mjs'
      - '.github/workflows/peer-room-ci.yml'
  pull_request:
    paths:
      - 'src/js/33-direct-chat-v2.js'
      - 'src/js/34-peer-room-foundation.js'
      - 'src/js/35-peer-room-hardening.js'
      - 'src/js/36-peer-room-match.js'
      - 'src/js/37-peer-room-runtime.js'
      - 'src/js/38-peer-room-polish.js'
      - 'src/js/39-peer-room-presentation.js'
      - 'src/js/40-peer-room-transaction.js'
      - 'src/js/41-peer-room-presentation-sync.js'
      - 'src/js/42-peer-room-recovery-nav.js'
      - 'src/styles/67-peer-room-foundation.css'
      - 'src/styles/68-peer-room-match.css'
      - 'src/styles/69-peer-room-polish.css'
      - 'src/styles/70-peer-room-presentation.css'
      - 'tests/test-direct-chat-v2.mjs'
      - 'tests/test-direct-chat-v2-generated.mjs'
      - 'tests/test-peer-room-hardening.mjs'
      - 'tests/test-peer-room-match.mjs'
      - 'tests/test-peer-room-match-soak.mjs'
      - 'tests/test-peer-room-runtime.mjs'
      - 'tests/test-peer-room-polish.mjs'
      - 'tests/test-peer-room-presentation.mjs'
      - 'tests/test-peer-room-transaction.mjs'
      - 'tests/test-peer-room-presentation-sync.mjs'
      - 'tests/test-peer-room-recovery-nav.mjs'
      - '.github/workflows/peer-room-ci.yml'

jobs:
  peer-room-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/js/33-direct-chat-v2.js
          node --check src/js/34-peer-room-foundation.js
          node --check src/js/35-peer-room-hardening.js
          node --check src/js/36-peer-room-match.js
          node --check src/js/37-peer-room-runtime.js
          node --check src/js/38-peer-room-polish.js
          node --check src/js/39-peer-room-presentation.js
          node --check src/js/40-peer-room-transaction.js
          node --check src/js/41-peer-room-presentation-sync.js
          node --check src/js/42-peer-room-recovery-nav.js
          node --check tests/test-direct-chat-v2.mjs
          node --check tests/test-direct-chat-v2-generated.mjs
          node --check tests/test-peer-room-hardening.mjs
          node --check tests/test-peer-room-match.mjs
          node --check tests/test-peer-room-match-soak.mjs
          node --check tests/test-peer-room-runtime.mjs
          node --check tests/test-peer-room-polish.mjs
          node --check tests/test-peer-room-presentation.mjs
          node --check tests/test-peer-room-transaction.mjs
          node --check tests/test-peer-room-presentation-sync.mjs
          node --check tests/test-peer-room-recovery-nav.mjs
      - name: Peer Room source contract
        run: node tests/test-direct-chat-v2.mjs
      - name: Remove Player cleanup contract
        run: node tests/test-peer-room-hardening.mjs
      - name: Shared match + persistent lobby contract
        run: node tests/test-peer-room-match.mjs
      - name: Shared match 160-game host-authority soak
        run: node tests/test-peer-room-match-soak.mjs
      - name: Runtime route + live room chat contract
        run: node tests/test-peer-room-runtime.mjs
      - name: Colors + P2 responsiveness + lobby navigation
        run: node tests/test-peer-room-polish.mjs
      - name: Animation parity + collision-free live controls
        run: node tests/test-peer-room-presentation.mjs
      - name: Single-drop transaction + same-room rematch
        run: node tests/test-peer-room-transaction.mjs
      - name: Host-timed presentation sync contract
        run: node tests/test-peer-room-presentation-sync.mjs
      - name: Guest reconnect + universal Back contract
        run: node tests/test-peer-room-recovery-nav.mjs
      - name: Build Alpha shell
        run: python3 tools/build_duel_modes_alpha.py
      - name: Generated loader contract
        run: node tests/test-direct-chat-v2-generated.mjs