name: Finalize AI Tuning Beta 0.13.3

on:
  push:
    branches:
      - main
    paths:
      - .deploy-ai-0133

permissions:
  contents: write

jobs:
  finalize-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale tester version labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert 'Mobile Beta 0.13.3' in s
          s=s.replace('Mobile Beta · 0.13.1','Mobile Beta · 0.13.3')
          s=s.replace('MOBILE BETA 0.13.1','MOBILE BETA 0.13.3')
          s=s.replace('[Beta 0.13.2]','[Beta 0.13.3]')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize Mobile Beta 0.13.3 version labels"
          git push origin HEAD:main
