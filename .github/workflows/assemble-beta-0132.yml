name: Assemble Mobile Beta 0.13.2

on:
  push:
    branches:
      - main
    paths:
      - .deploy-beta-0132-trigger

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/beta-0.13.2
      - name: Assemble tested index.html on release branch
        shell: bash
        run: |
          cat .deploy/index.part0 .deploy/index.part1 > /tmp/index.b64
          base64 -d /tmp/index.b64 | gzip -d > index.html
          rm -rf .deploy
          rm -f .github/workflows/assemble-beta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Mobile Beta 0.13.2 feedback workflow"
          git push origin HEAD:release/beta-0.13.2
