name: Multiplayer Release Gate
on:
  pull_request:
    paths:
      - 'src/js/1[3-9]*'
      - 'src/js/20*'
      - 'src/js/3[3-9]*'
      - 'src/js/4[0-7]*'
      - 'server/**'
      - 'tools/build_duel_modes_alpha.py'
      - 'multiplayer-network.json'
      - 'multiplayer-alpha.html'
      - 'tests/playtest-multiplayer-release.mjs'
      - '.github/workflows/multiplayer-release-gate.yml'
  workflow_dispatch:
    inputs:
      live_url:
        description: HTTPS game URL for a public release check (empty uses an isolated fixture)
        required: false
        type: string
      suite:
        description: Public checks to run (all tests run for pull requests)
        required: false
        type: choice
        default: all
        options: [all, relay, hosted]
jobs:
  required-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        host: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Start isolated authenticated TURN and Hosted Room fixtures
        if: ${{ inputs.live_url == '' }}
        run: |
          sudo apt-get install -y coturn
          # Use the runner's private interface. Browsers may reject loopback ICE
          # candidates even when a TURN allocation on localhost succeeds.
          relay_ip="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<NF;i++) if($i=="src") print $(i+1)}')"
          test -n "$relay_ip"
          relay_secret="$(openssl rand -hex 32)"
          relay_config="$(mktemp)"
          chmod 600 "$relay_config"
          cat > "$relay_config" <<EOF_CONFIG
          listening-ip=$relay_ip
          relay-ip=$relay_ip
          listening-port=34790
          min-port=49000
          max-port=49100
          realm=clash4-ci
          use-auth-secret
          static-auth-secret=$relay_secret
          no-tls
          no-dtls
          no-cli
          total-quota=100
          EOF_CONFIG
          turnserver -c "$relay_config" > /tmp/clash4-turn.log 2>&1 &
          relay_pid=$!
          TURN_SHARED_SECRET="$relay_secret" TURN_URLS="turn:$relay_ip:34790?transport=tcp" node server/duel-server.mjs > /tmp/clash4-hosted.log 2>&1 &
          cat > multiplayer-network.json <<'EOF_CONFIG'
          {"hostedServer":"http://127.0.0.1:8787","relayCredentialEndpoint":"http://127.0.0.1:8787/api/ice"}
          EOF_CONFIG
          python3 tools/build_duel_modes_alpha.py
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/clash4-http.log 2>&1 &
          for i in {1..20}; do
            kill -0 "$relay_pid"
            if ss -ltn | grep -q ":34790 " && curl -fsS http://127.0.0.1:8787/api/health >/dev/null && curl -fsS http://127.0.0.1:8080/multiplayer-alpha.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          exit 1
      - name: Verify actual relay routes and hosted gameplay
        env:
          C4_HOST: ${{ matrix.host }}
          C4_TARGET: ${{ inputs.live_url }}
          C4_SUITE: ${{ inputs.live_url != '' && inputs.suite || 'all' }}
        run: node tests/playtest-multiplayer-release.mjs
