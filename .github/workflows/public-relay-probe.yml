name: Public TURN probe
on:
  pull_request:
    paths:
      - 'tests/probe-open-relay.mjs'
      - '.github/workflows/public-relay-probe.yml'
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/probe-open-relay.mjs
