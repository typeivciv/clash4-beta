name: Duel Modes Alpha CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/js/10-rules.js'
      - 'src/js/12-duel-projection.js'
      - 'src/js/13-duel-client.js'
      - 'src/js/14-duel-bindings.js'
      - 'src/js/15-duel-local-core.js'
      - 'src/js/16-duel-direct-webrtc.js'
      - 'src/js/17-duel-pass-play.js'
      - 'src/js/18-duel-router.js'
      - 'src/js/19-duel-nearby-qr.js'
      - 'src/js/20-duel-turn-alpha.js'
      - 'src/js/21-duel-colors-share.js'
      - 'src/js/22-duel-postmatch.js'
      - 'src/styles/50-private-duel.css'
      - 'src/styles/51-duel-turn-alpha.css'
      - 'src/styles/52-duel-colors-share.css'
      - 'src/styles/53-duel-postmatch.css'
      - 'src/ui/private-duel-lobby.html'
      - 'tools/build_private_duel_alpha.py'
      - 'tools/build_duel_modes_alpha.py'
      - 'tests/test-duel-*.mjs'
      - 'tests/test-direct-*.mjs'
      - 'tests/test-private-duel-build.mjs'
      - '.github/workflows/duel-alpha-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'src/js/10-rules.js'
      - 'src/js/12-duel-projection.js'
      - 'src/js/13-duel-client.js'
      - 'src/js/14-duel-bindings.js'
      - 'src/js/15-duel-local-core.js'
      - 'src/js/16-duel-direct-webrtc.js'
      - 'src/js/17-duel-pass-play.js'
      - 'src/js/18-duel-router.js'
      - 'src/js/19-duel-nearby-qr.js'
      - 'src/js/20-duel-turn-alpha.js'
      - 'src/js/21-duel-colors-share.js'
      - 'src/js/22-duel-postmatch.js'
      - 'src/styles/50-private-duel.css'
      - 'src/styles/51-duel-turn-alpha.css'
      - 'src/styles/52-duel-colors-share.css'
      - 'src/styles/53-duel-postmatch.css'
      - 'src/ui/private-duel-lobby.html'
      - 'tools/build_private_duel_alpha.py'
      - 'tools/build_duel_modes_alpha.py'
      - 'tests/test-duel-*.mjs'
      - 'tests/test-direct-*.mjs'
      - 'tests/test-private-duel-build.mjs'
      - '.github/workflows/duel-alpha-ci.yml'

permissions:
  contents: write

jobs:
  duel-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check server/direct-signal-store.mjs
          node --check server/duel-server.mjs
          node --check src/js/10-rules.js
          node --check src/js/12-duel-projection.js
          node --check src/js/13-duel-client.js
          node --check src/js/14-duel-bindings.js
          node --check src/js/15-duel-local-core.js
          node --check src/js/16-duel-direct-webrtc.js
          node --check src/js/17-duel-pass-play.js
          node --check src/js/18-duel-router.js
          node --check src/js/19-duel-nearby-qr.js
          node --check src/js/20-duel-turn-alpha.js
          node --check src/js/21-duel-colors-share.js
          node --check src/js/22-duel-postmatch.js
          node --check tests/test-direct-duel-soak.mjs
          python3 -m py_compile tools/build_private_duel_alpha.py tools/build_duel_modes_alpha.py
      - name: Client ordering contract
        run: node tests/test-duel-client-contract.mjs
      - name: Server update-history integration
        run: node tests/test-duel-server-history.mjs
      - name: Signaling store isolation
        run: node tests/test-direct-signaling.mjs
      - name: Local authority and Fog parity
        run: node tests/test-duel-local-core.mjs
      - name: Direct Duel 500-game soak QA
        run: node tests/test-direct-duel-soak.mjs
      - name: Split-timeout Direct recovery, TURN, colors/share, unified postmatch, rematch, and Pass contracts
        run: node tests/test-duel-mode-contract.mjs
      - name: Build isolated Alpha client
        run: python3 tools/build_duel_modes_alpha.py
      - name: Generated client contract
        run: node tests/test-private-duel-build.mjs
      - name: Publish Pages staging client
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain -- private-duel-alpha.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add private-duel-alpha.html
            git commit -m "Build Duel Modes Alpha 0.15.13 split-timeout recovery"
            git push
          else
            echo "Staging client already matches canonical sources."
          fi
